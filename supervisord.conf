[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true

[program:x11]
command=Xvfb :1 -screen 0 1280x720x24
autorestart=true

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
autorestart=true

[program:xrdp-chansrv]
command=/usr/sbin/xrdp-chansrv --nodaemon
environment=DISPLAY=":1"
autorestart=true

[program:vnc]
command=x11vnc -forever -shared -display :1 -rfbport 5900 -nopw
autorestart=true

[program:desktop]
command=startxfce4
environment=DISPLAY=":1"
autorestart=true
